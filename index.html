<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Own-HN">
<meta name="theme-color" content="#ff6600">
<meta name="color-scheme" content="light only">
<title>Own-HN</title>
<style>
  :root {
    --bg: #f6f6ef; --card: #fff; --text: #1a1a1a; --muted: #6b6b6b;
    --line: #e2e2d8; --accent: #ff6600; --accent-text: #fff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  header {
    background: var(--accent); color: var(--accent-text);
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    font-weight: 700; font-size: 18px;
    display: flex; justify-content: space-between; align-items: center;
  }
  header button { background: none; border: 0; color: inherit; font-size: 14px; padding: 4px 0; }
  main { max-width: 720px; margin: 0 auto; padding: 12px 16px 40px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .chips { display: flex; flex-direction: column; gap: 6px; }
  .chips button {
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
    border-radius: 8px; padding: 10px 12px; font-size: 16px; text-align: left;
  }
  .chips button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  #status { color: var(--muted); font-size: 14px; margin: 14px 2px 8px; }
  ol { list-style: none; margin: 0; padding: 0; }
  li { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  li a.t { color: var(--text); text-decoration: none; font-weight: 600; }
  [hidden] { display: none !important; }
  button.more {
    display: block; width: 100%; margin: 12px 0 8px; padding: 10px; font-size: 15px;
    border: 1px dashed var(--line); border-radius: 8px; background: none; color: var(--muted);
  }
  /* Dim a read story but keep its summary easy to read. */
  li.read > :not(.summary) { opacity: 0.5; }
  li.read a.t { font-weight: 400; }
  .dom { color: var(--muted); font-size: 13px; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .meta a { color: var(--muted); }
  .meta button.sum { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); text-decoration: underline; }
  .summary {
    margin-top: 10px; padding: 10px 12px; border-radius: 8px; font-size: 14px; line-height: 1.45;
    background: #fff4ec; border-left: 3px solid var(--accent);
  }
  .summary .tldr { margin: 0 0 6px; }
  .summary .tldr b { color: var(--accent); }
  .summary ul { margin: 0; padding-left: 18px; }
  .summary li { background: none; border: 0; padding: 0; margin: 0 0 4px; border-radius: 0; }
  .summary .why { margin: 6px 0 0; }
  .summary .why b { color: var(--accent); }
  .summary .note { margin: 6px 0 0; font-size: 12px; color: var(--muted); font-style: italic; }
  .summary.err { background: var(--bg); border-left-color: var(--line); color: var(--muted); }
  .pts { color: var(--accent); font-weight: 700; }
</style>
</head>
<body>
<header>Own-HN <button id="keyBtn" type="button">⚙ API key</button></header>
<main>
  <div class="card"><div class="chips" id="chips"></div></div>

  <div id="status"></div>
  <ol id="list"></ol>
  <button class="more" id="moreBtn" type="button" hidden></button>
  <ol id="hiddenList" hidden></ol>
</main>

<script>
const API = "https://hn.algolia.com/api/v1/search";
// Every filter covers the last 24 hrs and all post types except comments.
// The "story" tag already includes Show HN and Ask HN; polls are tagged separately.
const HOURS = 24;
const TAGS = "(story,poll)";
// Quick filters. Points max is inclusive; null means no upper limit.
const PRESETS = [
// techOnly hides stories that don't look tech-related (see isTech below).
  { id: "100", label: "100+", min: 100, max: 199, techOnly: true },
  { id: "200", label: "200+", min: 200, max: 299, techOnly: true },
  { id: "300", label: "300+", min: 300, max: 399, techOnly: true },
  { id: "400", label: "400+", min: 400, max: 499, techOnly: true },
  { id: "500", label: "500+", min: 500, max: null, techOnly: true },
  { id: "ai", label: "AI 10+", min: 10, max: null, q: "ai" },
  { id: "ai20", label: "AI 20+", min: 20, max: null, q: "ai" },
];
const DEFAULT_ID = "500";

const $ = (id) => document.getElementById(id);
const chipsEl = $("chips");

PRESETS.forEach((p) => {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = p.label;
  b.onclick = () => select(p);
  chipsEl.appendChild(b);
});

// The selected filter lives in the URL so a refresh or bookmark shows the same view.
function fromUrl() {
  const id = new URLSearchParams(location.search).get("f");
  return PRESETS.find((p) => p.id === id) || PRESETS.find((p) => p.id === DEFAULT_ID);
}

function select(p) {
  history.replaceState(null, "", "?f=" + p.id);
  [...chipsEl.children].forEach((b, i) => b.classList.toggle("on", PRESETS[i] === p));
  run(p);
}

async function fetchAll(f) {
  const since = Math.floor(Date.now() / 1000) - HOURS * 3600;
  const filters = [`points>=${f.min}`, `created_at_i>${since}`];
  if (f.max !== null) filters.push(`points<=${f.max}`);
  const hits = [];
  for (let page = 0; ; page++) {
    const p = new URLSearchParams({
      tags: TAGS,
      numericFilters: filters.join(","),
      hitsPerPage: 1000,
      page,
      queryType: "prefixNone", // "ai" matches the word ai, not "aim" or "air"
      attributesToRetrieve: "title,url,points,num_comments,created_at_i,objectID",
      attributesToHighlight: "",
    });
    if (f.q) p.set("query", f.q);
    const res = await fetch(API + "?" + p);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    hits.push(...data.hits);
    if (page + 1 >= data.nbPages) break;
  }
  return hits.sort((a, b) => b.points - a.points);
}

function ago(ts) {
  const m = Math.floor((Date.now() / 1000 - ts) / 60);
  if (m < 60) return m + "m ago";
  const h = Math.floor(m / 60);
  return h < 24 ? h + "h ago" : Math.floor(h / 24) + "d ago";
}

// Summaries come from Claude via the Anthropic API, called straight from this page.
// Your API key is kept only in this browser (localStorage); it is never part of the site.
// Claude's web fetch tool reads the article on Anthropic's side, so no other service is needed.
const KEY_KEY = "own-hn-anthropic-key";
const SUM_KEY = "own-hn-summaries-v2"; // bump to drop summaries saved in an older format

function getKey() { try { return localStorage.getItem(KEY_KEY) || ""; } catch { return ""; } }

function askKey() {
  const v = prompt("Anthropic API key (stored only in this browser). Leave empty to remove it.", getKey());
  if (v === null) return getKey();
  try { v.trim() ? localStorage.setItem(KEY_KEY, v.trim()) : localStorage.removeItem(KEY_KEY); } catch {}
  return v.trim();
}

function loadSummaries() {
  try {
    const all = JSON.parse(localStorage.getItem(SUM_KEY)) || {};
    const now = Date.now();
    // Entries without a source predate failure detection and may hold a "couldn't fetch" message.
    for (const id in all) if (now - all[id].at > READ_TTL || !all[id].source) delete all[id];
    return all;
  } catch { return {}; }
}

function saveSummary(id, text, source) {
  try {
    const all = loadSummaries();
    all[id] = { at: Date.now(), text, source };
    localStorage.setItem(SUM_KEY, JSON.stringify(all));
  } catch {}
}

const SUMMARY_FORMAT =
  `for a busy engineer skimming Hacker News. Keep it short: 75 words or fewer in total. ` +
  `Use exactly this format, no preamble, no markdown other than "- ":\n` +
  `TL;DR: <one sentence, at most 20 words, giving the key fact or takeaway the title doesn't already say; ` +
  `the reader has already seen the title, so never restate it>\n` +
  `- <exactly 3 bullets, at most 12 words each, with the most interesting specifics>\n` +
  `Why it matters: <one sentence, at most 15 words>`;

async function askClaude(body) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "x-api-key": getKey(),
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
      "content-type": "application/json",
    },
    body: JSON.stringify({
      model: "claude-haiku-4-5", // cheapest Claude model; plenty for short summaries
      max_tokens: 1024,
      ...body,
    }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    if (res.status === 401) throw new Error("API key was rejected. Tap ⚙ API key to fix it.");
    throw new Error(data.error?.message || "HTTP " + res.status);
  }
  if (data.stop_reason === "refusal") throw new Error("Claude declined to summarize this one.");
  return data.content || [];
}

// Plain text of the story's HN post and top comments, for when the article itself can't be read.
async function hnDiscussion(h) {
  const res = await fetch("https://hn.algolia.com/api/v1/items/" + h.objectID);
  if (!res.ok) throw new Error("Couldn't load the HN discussion (HTTP " + res.status + ").");
  const item = await res.json();
  const plain = (html) => new DOMParser().parseFromString(html || "", "text/html").body.textContent.trim();
  let out = item.text ? "Post text:\n" + plain(item.text) + "\n\n" : "";
  for (const c of item.children || []) {
    if (!c.text) continue;
    out += "Comment: " + plain(c.text) + "\n\n";
    if (out.length > 8000) break;
  }
  return out.trim();
}

// Returns { text, source } where source is "article" or "comments".
async function summarize(h) {
  if (h.url) {
    const content = await askClaude({
      tools: [{ type: "web_fetch_20250910", name: "web_fetch", max_uses: 1, max_content_tokens: 4000 }],
      messages: [{
        role: "user",
        content: `Fetch ${h.url} and summarize it ${SUMMARY_FORMAT}\n\n` +
          `If the fetch fails or the page has no real article text (for example it needs JavaScript ` +
          `and only the title loaded), reply with exactly NO_CONTENT and nothing else.\n\nTitle: ${h.title}`,
      }],
    });
    // Web fetch errors don't fail the request; they come back as an error block inside the result.
    const fetched = content.some((b) => b.type === "web_fetch_tool_result" && b.content?.type === "web_fetch_result");
    if (fetched) {
      // Keep only the text written after the fetch result (drops "I'll fetch the page…" preamble).
      const last = content.map((b) => b.type).lastIndexOf("web_fetch_tool_result");
      const text = content.slice(last + 1).filter((b) => b.type === "text").map((b) => b.text).join("").trim();
      if (text && !text.includes("NO_CONTENT")) return { text, source: "article" };
    }
  }
  // The article couldn't be read (blocked, paywalled) or there is none (Ask HN): use the HN discussion.
  const discussion = await hnDiscussion(h);
  if (!discussion) throw new Error("Couldn't read the article, and there are no HN comments yet.");
  const content = await askClaude({
    messages: [{
      role: "user",
      content: `The article${h.url ? " at " + h.url + " couldn't be fetched" : " is an HN post"}. ` +
        `From the title and the Hacker News discussion below, summarize what it is about and the main points people raise, ` +
        `${SUMMARY_FORMAT}\n\nTitle: ${h.title}\n\n${discussion}`,
    }],
  });
  const text = content.filter((b) => b.type === "text").map((b) => b.text).join("").trim();
  if (!text) throw new Error("No summary came back.");
  return { text, source: "comments" };
}

function showSummary(li, text, isError, source) {
  let box = li.querySelector(".summary");
  if (!box) { box = document.createElement("div"); li.appendChild(box); }
  box.className = "summary" + (isError ? " err" : "");
  box.replaceChildren();
  let lines = isError ? [] : text.split("\n").map((l) => l.trim()).filter(Boolean);
  // Drop any preamble the model writes before the TL;DR line.
  const start = lines.findIndex((l) => /^tl;?dr:?/i.test(l));
  if (start > 0) lines = lines.slice(start);
  const bullets = lines.filter((l) => /^[-•*]\s/.test(l));
  if (!bullets.length) { box.textContent = text; return; } // errors and older plain summaries
  // Built with textContent only, so nothing from the API is ever parsed as HTML.
  const add = (tag, cls, label, body) => {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    if (label) { const b = document.createElement("b"); b.textContent = label + " "; el.appendChild(b); }
    el.append(body);
    return el;
  };
  const ul = document.createElement("ul");
  for (const l of lines) {
    if (/^tl;?dr:?/i.test(l)) box.appendChild(add("p", "tldr", "TL;DR:", l.replace(/^tl;?dr:?\s*/i, "")));
    else if (/^[-•*]\s/.test(l)) ul.appendChild(add("li", "", "", l.replace(/^[-•*]\s+/, "")));
    else if (/^why it matters:?/i.test(l)) {
      if (ul.childNodes.length) box.appendChild(ul);
      box.appendChild(add("p", "why", "Why it matters:", l.replace(/^why it matters:?\s*/i, "")));
    } else box.appendChild(add("p", "", "", l));
  }
  if (ul.childNodes.length && !ul.parentNode) box.appendChild(ul);
  if (source === "comments") box.appendChild(add("p", "note", "", "Summarized from HN comments; the article couldn't be read."));
}

function domain(url) {
  try { return new URL(url).hostname.replace(/^www\./, ""); } catch { return ""; }
}

// Tech filter: a story counts as tech if its title has a tech word or it links to a tech site.
// Add words here when a tech story ends up under "hidden". Entries ending in * match word starts.
const TECH_WORDS = `
  ai agi llm llms gpt chatgpt claude anthropic openai gemini deepmind copilot mistral llama ollama
  model* neural transformer* inference token* embedding* prompt* agent* agentic rag
  machine-learning ml deep-learning dataset* benchmark* training fine-tun* diffusion
  software hardware computer* comput* program* code coding coder* developer* dev devs devops
  engineer* algorithm* data database* sql sqlite postgres postgresql mysql redis kafka
  api apis sdk cli gui ui ux frontend backend fullstack web website* browser* html css
  javascript js typescript ts node nodejs deno bun react vue svelte angular nextjs wasm webassembly
  python rust go golang java kotlin swift c c++ c# .net dotnet ruby rails php perl haskell ocaml
  elixir erlang clojure lisp scheme zig nim julia scala fortran cobol assembly asm lua dart
  compiler* interpreter* runtime* bytecode jit llvm gcc clang syntax parser* type-system
  linux unix bsd freebsd openbsd kernel* os windows macos ios android debian ubuntu fedora arch nixos nix
  shell bash zsh terminal* vim emacs neovim vscode ide editor* git github gitlab commit* repo*
  docker kubernetes k8s container* vm vms virtual* emulat* hypervisor cloud aws azure gcp serverless
  server* datacenter* data-center* cpu* gpu* tpu* chip* semiconductor* silicon processor* risc-v riscv
  arm x86 intel amd nvidia tsmc qualcomm memory ram dram ssd storage cache* simd fpga asic
  pentium mhz ghz 8-bit 16-bit 32-bit 64-bit retro amiga commodore atari nes gameboy
  network* networking protocol* tcp udp http https dns ip ipv6 wifi bluetooth 5g router* bgp ssh tls ssl
  security vulnerabilit* exploit* cve malware ransomware hack* hacker* breach* sandbox* encrypt*
  crypto* cryptograph* password* passkey* auth* oauth privacy surveillance spyware phishing zero-day
  open-source opensource oss foss gpl mit-license license* bug* debug* debugger* test* testing
  performance latency throughput optimiz* benchmark scaling distributed consensus raft paxos
  app apps application* startup* saas platform* framework* libraries package* npm pip cargo
  internet online email smtp rss protocol url urls domain* website blog* static-site
  google apple microsoft meta amazon ibm oracle netflix tesla spacex twitter x.com reddit
  youtube facebook instagram whatsapp tiktok mozilla firefox chrome chromium safari
  algorithm robot* robotics automation drone* satellite* rocket* space physics math* mathematic*
  quantum electronic* circuit* pcb arduino raspberry microcontroller* firmware embedded iot sensor*
  gaming gamedev game-engine engine* graphics render* shader* opengl vulkan directx 3d pixel* display* screen*
  file* filesystem* format* json yaml xml csv unicode utf-8 regex spreadsheet* excel
  typeset* latex pdf markdown documentation docs spec* rfc standard* w3c ietf
  keyboard* mouse laptop* smartphone* phone* iphone ipad mac pc tablet* e-ink
  arxiv factorio minecraft godot unity unreal emulator*
  mcp saml rsa xss csrf overflow* vpn* tailscale wireguard zero-knowledge jpeg png image* codec* video-codec
  droid f-droid grapheneos discord slack sublime weights starlink waymo self-driving autonomous fiber
  archive* snowden grammarly fable frontier abliteration
`.trim().split(/\s+/);
const TECH_EXACT = new Set(TECH_WORDS.filter((w) => !w.endsWith("*")));
const TECH_STEMS = TECH_WORDS.filter((w) => w.endsWith("*")).map((w) => w.slice(0, -1));
const TECH_SITES = [
  "github.com", "gitlab.com", "codeberg.org", "sr.ht", "sourcehut.org", "go.dev", "rust-lang.org",
  "tokio.rs", "python.org", "arxiv.org", "lwn.net", "anthropic.com", "openai.com", "huggingface.co",
  "stackoverflow.com", "arstechnica.com", "theverge.com", "techcrunch.com", "theregister.com",
  "tomshardware.com", "phoronix.com", "404media.co", "simonwillison.net", "mozilla.org",
];
const TECH_TLDS = [".dev", ".io", ".ai", ".rs", ".sh", ".tech", ".app"];

function isTechWord(w) {
  if (TECH_EXACT.has(w)) return true;
  if (w.endsWith("s") && TECH_EXACT.has(w.slice(0, -1))) return true;
  return TECH_STEMS.some((s) => w.startsWith(s));
}

function isTech(h) {
  const t = h.title.toLowerCase();
  if (t.startsWith("show hn")) return true;
  const d = domain(h.url);
  if (d && (TECH_SITES.some((s) => d === s || d.endsWith("." + s)) || TECH_TLDS.some((x) => d.endsWith(x)))) return true;
  // Check whole tokens ("c++", "risc-v") and their hyphen parts ("git-bug" -> "git").
  const tokens = t.match(/[a-z0-9.+#-]+/g) || [];
  return tokens.some((tok) => {
    tok = tok.replace(/^[.-]+|[.-]+$/g, "");
    return isTechWord(tok) || tok.split("-").some(isTechWord);
  });
}

// Stories you opened are remembered on this device so they can be dimmed.
// Only the last 24 hrs are ever shown, so anything older than 2 days is dropped.
const READ_KEY = "own-hn-read";
const READ_TTL = 2 * 24 * 3600 * 1000;

function loadRead() {
  try {
    const all = JSON.parse(localStorage.getItem(READ_KEY)) || {};
    const now = Date.now();
    for (const id in all) if (now - all[id] > READ_TTL) delete all[id];
    return all;
  } catch { return {}; }
}

function markRead(id, li) {
  li.classList.add("read");
  try {
    const all = loadRead();
    all[id] = Date.now();
    localStorage.setItem(READ_KEY, JSON.stringify(all));
  } catch {}
}

function render(list, hits) {
  const read = loadRead();
  const sums = loadSummaries();
  list.replaceChildren();
  for (const h of hits) {
    const hn = "https://news.ycombinator.com/item?id=" + h.objectID;
    const li = document.createElement("li");
    if (read[h.objectID]) li.className = "read";

    const a = document.createElement("a");
    a.className = "t";
    a.href = h.url || hn;
    a.textContent = h.title;
    li.appendChild(a);

    const d = domain(h.url);
    if (d) {
      const s = document.createElement("span");
      s.className = "dom";
      s.textContent = " (" + d + ")";
      li.appendChild(s);
    }

    const meta = document.createElement("div");
    meta.className = "meta";
    const pts = document.createElement("span");
    pts.className = "pts";
    pts.textContent = h.points + " pts";
    const c = document.createElement("a");
    c.href = hn;
    c.textContent = (h.num_comments || 0) + " comments";
    // One link per story: "Summarize" until there is a summary, then "Hide/Show summary".
    const sb = document.createElement("button");
    sb.type = "button";
    sb.className = "sum";
    const saved = sums[h.objectID];
    const setToggle = (collapsed) => {
      sb.textContent = collapsed ? "Show summary" : "Hide summary";
      const box = li.querySelector(".summary");
      if (box) box.hidden = collapsed;
    };
    sb.textContent = "Summarize";
    sb.onclick = async () => {
      if (li.querySelector(".summary:not(.err)")) {
        const collapsed = !li.querySelector(".summary").hidden;
        setToggle(collapsed);
        return;
      }
      if (!getKey() && !askKey()) return;
      sb.disabled = true;
      showSummary(li, "Summarizing…", true);
      try {
        const { text, source } = await summarize(h);
        saveSummary(h.objectID, text, source);
        showSummary(li, text, false, source);
        markRead(h.objectID, li);
        setToggle(false);
      } catch (e) {
        showSummary(li, e.message, true);
      }
      sb.disabled = false;
    };
    meta.append(pts, ` · ${ago(h.created_at_i)} · `, c, " · ", sb);
    li.appendChild(meta);
    if (saved) {
      showSummary(li, saved.text, false, saved.source);
      setToggle(true); // saved summaries start collapsed after a refresh
    }

    // Opening the article or the comments marks the story as read.
    li.addEventListener("click", (e) => { if (e.target.closest("a")) markRead(h.objectID, li); });
    list.appendChild(li);
  }
}

let runId = 0;
async function run(f) {
  const id = ++runId;
  $("status").textContent = "Loading…";
  try {
    const all = await fetchAll(f);
    if (id !== runId) return; // a newer search started meanwhile
    const hits = f.techOnly ? all.filter(isTech) : all;
    const hidden = f.techOnly ? all.filter((h) => !isTech(h)) : [];
    render($("list"), hits);
    render($("hiddenList"), hidden);
    $("hiddenList").hidden = true;
    const more = $("moreBtn");
    more.hidden = hidden.length === 0;
    more.textContent = `Show ${hidden.length} non-tech ${hidden.length === 1 ? "story" : "stories"}`;
    const n = (k) => `${k} ${f.techOnly ? "tech " : ""}${k === 1 ? "story" : "stories"}`;
    $("status").textContent = hits.length
      ? `${n(hits.length)} in the last ${HOURS} hrs, most points first`
      : `No ${f.techOnly ? "tech " : ""}stories match in the last ${HOURS} hrs.`;
  } catch (e) {
    if (id !== runId) return;
    $("list").replaceChildren();
    $("hiddenList").replaceChildren();
    $("moreBtn").hidden = true;
    $("status").textContent = "Could not load news (" + e.message + "). Pull to refresh.";
  }
}

$("keyBtn").onclick = askKey;

$("moreBtn").onclick = () => {
  const list = $("hiddenList");
  list.hidden = !list.hidden;
  $("moreBtn").textContent = $("moreBtn").textContent.replace(/^(Show|Hide)/, list.hidden ? "Show" : "Hide");
};

select(fromUrl());
</script>
</body>
</html>
